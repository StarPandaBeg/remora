services:
    remora-db:
        image: pgvector/pgvector:pg14
        environment:
            POSTGRES_USER: remora
            POSTGRES_PASSWORD: password
            POSTGRES_DB: remora
        ports:
            - '${POSTGRES_PORT:-5432}:5432'
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U remora -d remora']
            interval: 5s
            timeout: 5s
            retries: 10

    remora-minio:
        image: firstfinger/minio:latest
        environment:
            MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin}
            MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-admin123123}
        ports:
            - '${MINIO_PORT:-9000}:9000'
            - '${MINIO_CONSOLE_PORT:-9001}:9002'
        volumes:
            - miniodata:/data
        healthcheck:
            test:
                ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
            interval: 5s
            timeout: 5s
            retries: 10

    remora-worker:
        build:
            context: ./packages/worker
        environment:
            WORKER_SECRET: ${WORKER_SECRET}
            MINIO_ENDPOINT: remora-minio
            MINIO_PORT: 9000
            MINIO_USE_SSL: 'false'
            MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
            MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-admin123123}
            MINIO_BUCKET: ${MINIO_BUCKET:-remora}
            MINIO_REGION: ${MINIO_REGION:-us-east-1}
            MAX_CONCURRENT_TASKS: ${MAX_CONCURRENT_TASKS:-2}
            HTTP_TIMEOUT: ${HTTP_TIMEOUT:-10}
            FINAL_EVENT_RETRY_COUNT: ${FINAL_EVENT_RETRY_COUNT:-3}
            FINAL_EVENT_RETRY_BASE_DELAY: ${FINAL_EVENT_RETRY_BASE_DELAY:-0.25}
        ports:
            - '${WORKER_PORT:-8000}:8000'
        depends_on:
            remora-minio:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD',
                    'python',
                    '-c',
                    "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

    remora-db-init:
        build:
            context: .
            dockerfile: packages/core/Dockerfile
            target: build
        environment:
            POSTGRES_URL: postgres://remora:password@remora-db:5432/remora
        command: ['npm', 'run', 'db:push', '--workspace=@remora/core']
        depends_on:
            remora-db:
                condition: service_healthy
        restart: 'no'

    remora-core:
        build:
            context: .
            dockerfile: packages/core/Dockerfile
            target: runtime
        environment:
            HOST: 0.0.0.0
            PORT: 3000
            PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:3000}
            WORKER_CALLBACK_BASE_URL: http://remora-core:3000
            WORKER_URL: http://remora-worker:8000
            WORKER_REQUEST_TIMEOUT: ${WORKER_REQUEST_TIMEOUT:-10000}
            WORKER_SECRET: ${WORKER_SECRET}
            POSTGRES_URL: postgres://remora:password@remora-db:5432/remora
            MINIO_ENDPOINT: remora-minio
            MINIO_PORT: 9000
            MINIO_USE_SSL: 'false'
            MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
            MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-admin123123}
            MINIO_BUCKET: ${MINIO_BUCKET:-remora}
            MINIO_REGION: ${MINIO_REGION:-us-east-1}
            MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES:-10737418240}
        ports:
            - '${PORT:-3000}:3000'
        depends_on:
            remora-db-init:
                condition: service_completed_successfully
            remora-minio:
                condition: service_healthy
            remora-worker:
                condition: service_healthy

volumes:
    pgdata:
    miniodata:
